name: 待办提醒检查

on:
  schedule:
    # 每30分钟运行一次 (UTC时间，北京时间 = UTC+8)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  check-todos:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查待办并发送提醒
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python check_todos.py
