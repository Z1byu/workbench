name: Daily News Update

on:
  schedule:
    # UTC time, CST=UTC+8
    # 7:00, 12:00, 18:00, 22:00 CST = 23:00, 4:00, 10:00, 14:00 UTC
    - cron: '0 23,4,10,14 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch news and update HTML
        run: python gh_update_news.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update news data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
